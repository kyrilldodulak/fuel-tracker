name: Scrape fuel prices

on:
  schedule:
    # 06:00 and 14:00 Kyiv (UTC+3 summer / UTC+2 winter) — minfin updates around midday
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape
      - name: Commit data if changed
        run: |
          git config user.name "fuel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: $(TZ=Europe/Kyiv date +'%Y-%m-%d %H:%M')"
            git push
          fi
